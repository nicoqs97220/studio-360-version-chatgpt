async function gen(force=false) {
  if(tabBusy)return;
  const p=plan();
  if(!p.valid||!p.share||!activeGenerationText(p).trim())throw Error('Vérifie le texte à envoyer, puis valide la génération à l’étape 3.');
  tabBusy=true;
  try {
    await flush();
    const args={project:doc.id,plan:p.id,version};
    msg('Vérification des moteurs gratuits…');
    let report=await api('/api/engines',{...args,details:true,refresh:force});
    if(!force&&!report.engines.length&&Date.now()-report.time>5000)report=await api('/api/engines',{...args,details:true,refresh:true});
    if(!report.engines.length){engineChoices(report,p);return;}
    modal.close();
    const batch={project:doc.id,stopped:false,left:report.engines.length};
    currentEngineBatch=batch;
    location.hash='gallery';await loadJobs();
    msg('Envoi à '+report.engines.length+' moteur(s) compatible(s).');
    let lastView=0;
    async function run(engine,retry=false) {
      if(batch.stopped)return {status:'arrêté'};
      const result=await api('/api/start',{...args,catalogTime:report.time,engine:engine.key,retryRejected:force||retry});
      if(!retry)batch.left--;
      if(doc?.id===batch.project&&route==='gallery'&&Date.now()-lastView>900){lastView=Date.now();await loadJobs();}
      return result;
    }
    async function hordeSweep(engines) {
      const results=[],retry=[];
      let waitUntil=0,spentWaiting=0;
      async function attempt(engine,index,repeat) {
        const remaining=Math.max(0,waitUntil-Date.now());
        if(remaining>60000-spentWaiting){
          results[index]={status:'rejected',reason:Error('AI Horde demande une pause. Réessaie après '+new Date(waitUntil).toLocaleTimeString('fr-FR')+'.')};
          return;
        }
        if(remaining){
          spentWaiting+=remaining;
          while(!batch.stopped&&waitUntil>Date.now())await new Promise(r=>setTimeout(r,Math.min(500,waitUntil-Date.now())));
        }
        try{
          const value=await run(engine,repeat);results[index]={status:'fulfilled',value};
          if(value.status==='échec'&&value.retryable&&/\b429\b/.test(value.error)){
            waitUntil=value.retryAt>Date.now()?value.retryAt:Date.now()+2500;
            if(!repeat)retry.push(index);
          }
        }catch(reason){results[index]={status:'rejected',reason};}
      }
      for(const [index,engine] of engines.entries())await attempt(engine,index,false);
      for(const index of retry)if(!batch.stopped)await attempt(engines[index],index,true);
      return results;
    }
    const horde=report.engines.filter(e=>e.tool==='AI Horde');
    const others=report.engines.filter(e=>e.tool!=='AI Horde');
    const first=hordeSweep(horde),second=submitLimited(others,3,e=>run(e));
    const results=[...await first,...await second];
    currentEngineBatch=null;
    if(doc?.id!==batch.project)return;
    await loadJobs();
    const errors=results.filter(x=>x.status==='rejected'||x.value?.status==='échec');
    if(errors.length===results.length){
      engineChoices({...report,state:'submissions-failed',issues:[...new Set(errors.map(x=>x.value?.error||x.reason?.message||'Service indisponible.'))]},p);
    } else if(errors.length)msg(errors.length+' moteur(s) ont refusé la demande. Détails dans la galerie.');
  } finally {currentEngineBatch=null;tabBusy=false;finishComparisonSave()}
}
async function up(input){if(!input.files?.length||mediaBusy)return;mediaBusy=true;const files=[...input.files],role=$('role').value,p=plan(),pid=doc.id,errors=[];input.disabled=true;try{for(const [i,f] of files.entries()){try{if(f.size>95*1024*1024)throw Error('limite de 95 Mo');$('sync').textContent='Import '+(i+1)+'/'+files.length;const mime=f.type||({mov:'video/quicktime',mp4:'video/mp4',jpg:'image/jpeg',png:'image/png',pdf:'application/pdf',wav:'audio/wav'}[f.name.split('.').pop().toLowerCase()])||'application/octet-stream';const a=await api('/api/media',null,{method:'POST',headers:{'Content-Type':mime,'X-File-Size':String(f.size)},body:f});if(doc.id!==pid)throw Error('Le projet a changé.');Object.assign(a,{name:f.name,path:f.webkitRelativePath||'',role});doc.assets.push(a);p.refs.push(a.id);dirty();await flush()}catch(e){errors.push(f.name+' · '+e.message)}}draw();if(errors.length)show('Bilan de l’import','<p>'+esc(errors.join('\n'))+'</p>');else if(p.mode==='video'&&p.valid&&p.share)await gen();else msg('Références ajoutées au plan.')}finally{mediaBusy=false}}

async function action(a,v){if(a==='bigmodel-on'||a==='bigmodel-off')return bigModelKeyAction(a);const p=plan();if(a==='studio-guide'){location.hash='help';draw();return;}if(a==='studio-catalog'){location.hash='engines';draw();return}if(a==='home')return goOverview('home');if(a==='projects-refresh')return readProjects();if(a==='new-project')return newProjectForm();if(a==='quick-start')return startQuick(v);if(a==='quick-history')return readQuickHistory();if(a==='quick-dest')return selectDestination(v);if(a==='jump-step')return jumpWorkflowStep(Number(v));if(a.startsWith('compare-'))return compareAction(a,v);if(a==='ask-prompt')return openPromptAssistant(v);if(a.startsWith('qe-'))return quickEditorAction(a,v);if(a==='nav'){modal.close();location.hash=v;return}if(a==='projects')return goOverview('projets');if(a==='load')return switchContext(async()=>activateWorkspace(await api('/api/project/'+encodeURIComponent(v))));
 if(a==='mic'){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){msg('Utilise le micro du clavier de ton téléphone dans le champ de description.');document.querySelector('[data-field="request"]').focus();return}const rec=new SR();rec.lang='fr-FR';rec.onresult=e=>{p.request=(p.request+' '+e.results[0][0].transcript).trim();invalidateComparisonIfEdited(p);p.valid=false;p.researched=false;dirty();draw()};rec.onerror=e=>msg('Dictée indisponible · '+e.error);rec.start();msg('Parle maintenant.');return}
 if(a==='research'){if(!p.request.trim())throw Error('Décris le plan avant la recherche.');const q=p.query?.trim()||p.request.slice(0,160);const r=await api('/api/search',{query:q});p.sources=r.sources;p.summary=[p.request,doc.brief.da&&('Direction artistique : '+doc.brief.da),p.timing&&('Action dans le temps : '+p.timing),...r.sources.slice(0,1).map(s=>'À vérifier avec la référence « '+s.title+' » : '+s.extract)].filter(Boolean).join('\n\n');p.valid=false;p.researched=true;dirty();draw();if(!p.sources.length)msg('Aucun article trouvé. Précise le sujet ou ajoute une référence vérifiée.');return}
 if(a==='prepare')return compareAction('compare-submit');
 if(a==='translate'){if(!p.fr)throw Error('Compose ou écris le prompt français.');const r=await api('/api/translate',{text:p.fr});p.zh=r.text;p.valid=false;dirty();draw();return}
 if(a==='copyZh'||a==='copyFr'||a==='bundle')return copy(a==='bundle'?dossier():a==='copyZh'?p.zh:p.fr);
 if(a==='satisfied'){modal.close();msg('Choisis ton rendu avec « Retenir ce rendu ».');if(location.hash!=='#gallery')location.hash='gallery';return}
 if(a==='toHiggs'){const text=p.promptChoice?activeGenerationText(p):(p.fr||p.request||'');if(!text.trim())throw Error('Choisis le texte à envoyer dans l’atelier.');const copied=copyNow(text),url=higgsUrl(p.mode),w=window.open(url,'_blank');if(w)try{w.opener=null}catch{}
  if(!w){show('Ouvrir Higgsfield',(copied?'<p>Prompt copié.</p>':'<textarea id="manualCopy">'+esc(text)+'</textarea>')+'<p>'+link(url,'Ouvrir Higgsfield ('+(p.mode==='video'?'vidéo':'image')+')')+'</p>');if(!copied)$('manualCopy').select();return}
  modal.close();if(!copied){show('Copier le prompt','<textarea id="manualCopy">'+esc(text)+'</textarea>');$('manualCopy').select()}else msg('Prompt copié. Colle-le dans Higgsfield.');return}
 if(a.startsWith('space-'))return adjustDiscovery(a);if(a==='availability-text')return separateTextTest(p);if(a==='availability-stop'){if(currentEngineBatch)currentEngineBatch.stopped=true;draw();msg('Les envois restants sont arrêtés. Les demandes déjà reçues par les services peuvent aboutir.');return;}if(a==='availability-square'){p.ratio='1:1';p.valid=false;p.share=false;dirty();modal.close();location.hash='atelier';draw();msg('Format carré sélectionné. Vérifie le prompt et lance l’image.');return;}if(a==='availability-retry')return gen(true);if(a==='availability-copy')return copy(activeGenerationText(p));if(a==='cf-settings')return cloudflareSettings();if(a==='catalog')return catalog(true);if(a==='generate'||a==='partial')return gen(a==='partial');if(a==='reloadJobs')return refreshJobs();
 if(a==='newplan'){const x={id:make(),title:'Plan '+(doc.plans.length+1),mode:'image',ratio:p.ratio,request:'',summary:'',fr:'',zh:'',refs:[],valid:false,share:false,take:1};doc.plans.push(x);doc.active=x.id;dirty();draw();return}
 if(a==='activate'){doc.active=v;dirty();location.hash='atelier';draw();return}if(a==='earlier'){let i=doc.plans.findIndex(x=>x.id===v);if(i>0)[doc.plans[i-1],doc.plans[i]]=[doc.plans[i],doc.plans[i-1]];dirty();draw();return}
 if(a==='preview'){const item=allMedia().find(x=>x.id===v);if(!item)return;show(item.name,media(item,true)+'<p><a class="button" href="'+mediaUrl(item)+'" download="'+esc(item.name)+'">Enregistrer sur cet appareil</a></p>',true);return}
 if(a==='choose'){if(doc.quick)return chooseQuickResult(v);const j=jobs.find(x=>x.id===v),scene=doc.plans.find(x=>x.id===j.plan);scene.chosen=j.media;dirty();show('Rendu retenu pour '+scene.title,media(j.media,true)+'<label>Dossier du projet<input id="dest" value="Sélections"></label><div class="actions">'+bt('file','Classer dans le projet','primary',v)+'<a class="button" download="'+esc(j.media.name)+'" href="'+mediaUrl(j.media)+'">Enregistrer sur cet appareil</a></div>',true);return}
 if(a==='file'){const j=jobs.find(x=>x.id===v),f=$('dest').value||'Sélections',existing=doc.assets.find(a=>a.id===j.media.id);if(existing)existing.folder=f;else doc.assets.push({...j.media,role:'Rendu retenu',folder:f});dirty();await flush();modal.close();draw();return}
 if(a==='board'){show('Planche de storyboard','<div style="max-width:560px;aspect-ratio:9/16;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin:auto">'+doc.plans.map((x,i)=>'<div style="background:#e7eee8;min-width:0;overflow:hidden"><div class="thumb">'+media(x.chosen)+'</div><small>'+String(i+1)+' · '+esc(x.title)+'</small></div>').join('')+'</div>',true);return}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-do]');if(!b)return;e.preventDefault();b.disabled=true;try{await action(b.dataset.do,b.dataset.v)}catch(err){msg(err.message)}finally{b.disabled=false}});
document.addEventListener('input',e=>{const t=e.target;if(doc&&t.matches('input[data-field]:not([type=checkbox]),textarea[data-field]'))setField(t)});
document.addEventListener('change',async e=>{const t=e.target;try{if(t.id==='files'||t.id==='folder'){await up(t);return}if(!doc)return;if(t.matches('select[data-field],input[type=checkbox][data-field]')){if(t.dataset.field==='valid'&&t.checked&&!plan().researched){t.checked=false;throw Error('Lance d’abord la recherche sur le sujet du plan.')}setField(t);if(t.tagName==='SELECT')draw();return}if(t.dataset.ref){const p=plan();p.refs=t.checked?[...new Set([...p.refs,t.dataset.ref])]:p.refs.filter(id=>id!==t.dataset.ref);comparisonFieldChanged(p,'refs',t);dirty();if(p.mode==='video'&&p.valid&&p.share)await gen()}}catch(err){msg(err.message)}});
window.addEventListener('hashchange',draw);window.addEventListener('popstate',()=>restoreWorkspace().catch(e=>msg(e.message)));

boot();
